apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-api
  labels:
    app: tech-challenge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tech-challenge-api
  template:
    metadata:
      labels:
        app: tech-challenge-api
    spec:
      containers:
        - name: api
          image: tech-challenge-fase-1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: Telco Churn Prediction API
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: API_PREFIX
              value: /api
            - name: API_V1_PREFIX
              value: /api/v1
            - name: MODEL_NAME
              value: mlp.joblib
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi