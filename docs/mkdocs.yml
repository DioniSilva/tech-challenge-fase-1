site_name: Tech Challenge Fase 1
site_author: MLEKs

repo_url: https://github.com/DioniSilva/tech-challenge-fase-1

# Como o mkdocs.yml fica em `docs/`, as fontes ficam em `docs/docs/`.
docs_dir: docs
site_dir: site

theme:
  name: mkdocs

extra_css:
  - stylesheets/home.css
  - stylesheets/ml-canvas.css

nav:
  - Início: index.md
  - Projeto:
      - Arquitetura: arquitetura.md
      - Model Card: MODEL_CARD.md
      - Visão geral (ML Canvas): ml-canvas.md
      - Dataset: dataset.md
      - Estrutura do projeto: estrutura-do-projeto.md
      - Comparação de Modelos: comparativo-modelos.md
  - Guia:
      - Primeiros passos: getting-started.md
      - Comandos: comandos.md
      - MLflow: mlflow.md
  - Entrega:
      - Roteiro do vídeo STAR: roteiro-video-star.md
