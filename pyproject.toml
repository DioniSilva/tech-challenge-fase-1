[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tech_challenge_fase_1"
version = "0.0.1"
description = "Projeto Final Fase 1 MLET10"
authors = [
  { name = "MLEKs" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fairlearn>=0.13.0",
    "fastapi>=0.136.1",
    "huggingface-hub>=1.16.1",
    "ipython",
    "jinja2>=3.1.6",
    "jupyterlab",
    "matplotlib",
    "mkdocs",
    "mlflow>=3.12.0",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "uvicorn>=0.46.0",
    "imbalanced-learn>=0.11.0",
    "openpyxl>=3.1.5",
    "torch>=2.12.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ml_pipeline", "utils"]
force-sort-within-sections = true


[tool.flit.module]
name = "ml_pipeline"
